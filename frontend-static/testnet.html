<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EXTREME | Binance Futures Testnet</title>
  <script src="./guard.js"></script>
  <script src="./config.js"></script>
  <script type="module" src="./testnet.js"></script>
  <style>
    body { background: #110e0e; color: #e8d2b5; font: 16px system-ui, sans-serif; margin: 0; }
    main { max-width: 60rem; margin: auto; padding: 1.5rem; }
    a { color: inherit; }
    section, form { margin: 1rem 0; }
    fieldset { display: flex; flex-wrap: wrap; gap: 1rem; border: 1px solid #a5a79b; }
    label { display: grid; gap: .25rem; }
    input, select, button { background: #251d1d; color: inherit; padding: .45rem; border: 1px solid #a5a79b; border-radius: .25rem; }
    button { cursor: pointer; }
    li { margin: .4rem 0; overflow-wrap: anywhere; }
    ul { font-variant-numeric: tabular-nums; padding-left: 1.25rem; }
  </style>
</head>
<body>
<main>
  <a href="./index.html">EXTREME</a>
  <h1>Binance Futures Testnet</h1>
  <p id="status" role="status" aria-live="polite"></p>
  <form id="login" hidden>
    <fieldset>
      <legend>Đăng nhập quản trị</legend>
      <label>Email <input type="email" name="email" autocomplete="username" required></label>
      <label>Mật khẩu <input type="password" name="password" autocomplete="current-password" required></label>
      <button>Đăng nhập</button>
    </fieldset>
  </form>
  <div id="controls" hidden>
    <button id="refresh" type="button">Làm mới dữ liệu</button>
    <button id="logout" type="button">Đăng xuất</button>
    <section>
      <h2>Khóa Testnet</h2>
      <form id="add-key" autocomplete="off">
        <fieldset>
          <legend>Thêm khóa</legend>
          <label>Tên hiển thị <input name="label" required></label>
          <label>API key <input type="password" name="api_key" required></label>
          <label>API secret <input type="password" name="api_secret" required></label>
          <button>Xác minh và lưu</button>
        </fieldset>
      </form>
      <ul id="keys"></ul>
    </section>
    <section>
      <h2>Bot</h2>
      <form id="create-bot">
        <fieldset>
          <legend>Tạo cấu hình</legend>
          <label>Khóa <select id="api-key-id" name="api_key_id" required></select></label>
          <label>Cặp <select name="symbol"><option>BTCUSDT</option><option>ETHUSDT</option></select></label>
          <label>Hồ sơ <select name="risk_profile"><option>SAFE</option><option>BALANCED</option><option>GROWTH</option></select></label>
          <label>Ký quỹ USDT <input type="number" name="order_margin_usdt" min="0.01" step="0.01" required></label>
          <label>Đòn bẩy <input type="number" name="leverage" min="1" max="32767" value="1" required></label>
          <button>Tạo bot</button>
        </fieldset>
      </form>
      <ul id="bots"></ul>
    </section>
    <section><h2>Vị thế đang mở</h2><ul id="positions"></ul></section>
    <section><h2>Lịch sử giao dịch</h2><ul id="trades"></ul></section>
  </div>
</main>
</body>
</html>
