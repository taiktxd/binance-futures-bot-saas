<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <title>EXTREME | Giao dịch Futures Tự động</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@0.451.0/dist/umd/lucide.min.js"></script>
  <script src="/config.js"></script>
  <style>
    :root {
      --stone: #A5A79B;
      --champagne: #E8D2B5;
      --oxblood: #590907;
      --bg: #110E0E;
      --surface: #181414;
      --border: rgba(165, 167, 155, 0.22);
      --up: #34B37E;
      --down: #D64545;
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      background-color: var(--bg);
      color: var(--champagne);
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(ellipse 80% 45% at 85% 0%, rgba(89, 9, 7, 0.45), transparent 70%),
        radial-gradient(ellipse 60% 40% at 10% 100%, rgba(165, 167, 155, 0.08), transparent 70%);
      background-attachment: fixed;
    }
    .num {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
    }
    .panel {
      background: linear-gradient(180deg, rgba(28, 24, 24, 0.94) 0%, rgba(20, 17, 17, 0.96) 100%);
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    .panel-wine {
      background: linear-gradient(145deg, #590907 0%, #2A0403 100%);
      border: 1px solid rgba(232, 210, 181, 0.28);
      box-shadow: 0 14px 36px rgba(89, 9, 7, 0.35);
    }
    .panel-inset {
      background-color: rgba(14, 11, 11, 0.78);
      border: 1px solid rgba(165, 167, 155, 0.2);
    }
    .btn-wine {
      background: linear-gradient(180deg, #6E0D0A 0%, #590907 100%);
      color: #E8D2B5;
      border: 1px solid rgba(232, 210, 181, 0.35);
      transition: all 150ms ease;
    }
    .btn-wine:hover {
      border-color: #E8D2B5;
    }
    .btn-champagne {
      background-color: #E8D2B5;
      color: #2A0504;
      transition: background-color 150ms ease;
    }
    .btn-champagne:hover {
      background-color: #F4E2CB;
    }
    .btn-stone {
      background-color: rgba(165, 167, 155, 0.12);
      color: #E8D2B5;
      border: 1px solid rgba(165, 167, 155, 0.3);
    }
    .nav-active {
      color: #E8D2B5 !important;
      background-color: rgba(89, 9, 7, 0.6);
      border-color: rgba(232, 210, 181, 0.3) !important;
    }
    .m-active {
      color: #E8D2B5 !important;
    }
    input[type="range"] {
      accent-color: #E8D2B5;
    }
    .logo-frame {
      position: relative;
      overflow: hidden;
      border-radius: 0.5rem;
      border: 1px solid rgba(232, 210, 181, 0.38);
      box-shadow: 0 2px 10px rgba(89, 9, 7, 0.45);
    }
    .logo-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 25%, rgba(232, 210, 181, 0.35) 50%, transparent 75%);
      transform: translateX(-120%);
      animation: logoSheen 4.2s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes logoSheen {
      0%, 60% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }
    .extreme-run {
      display: inline-block;
      font-weight: 800;
      letter-spacing: 0.14em;
      background: linear-gradient(90deg, #E8D2B5 0%, #FFFFFF 28%, #D64545 50%, #A5A79B 72%, #E8D2B5 100%);
      background-size: 240% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: extremeRun 2.8s linear infinite;
    }
    @keyframes extremeRun {
      0% { background-position: 0% center; }
      100% { background-position: 240% center; }
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-16 md:pb-0">
  <!-- HEADER -->
  <header class="h-16 bg-[#141111]/95 backdrop-blur-md border-b border-[#A5A79B]/20 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto h-full px-4 lg:px-6 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 sm:gap-5 min-w-0">
        <button type="button" onclick="navigate('landing')" class="flex items-center gap-2.5 group shrink-0">
          <div class="logo-frame w-9 h-9 bg-[#110E0E] shrink-0"><img src="/logo.png" alt="EXTREME" class="w-full h-full object-cover" /></div>
          <span class="text-sm sm:text-base extreme-run tracking-[0.18em] sm:tracking-[0.22em]">EXTREME</span>
        </button>

        <nav class="hidden lg:flex items-center gap-1">
          <button type="button" data-route="dashboard" onclick="navigate('dashboard')" class="nav-btn px-2.5 py-1.5 text-xs font-medium rounded border border-transparent text-[#A5A79B] hover:text-[#E8D2B5] whitespace-nowrap">Tổng quan</button>
          <button type="button" data-route="api-keys" onclick="navigate('api-keys')" class="nav-btn px-2.5 py-1.5 text-xs font-medium rounded border border-transparent text-[#A5A79B] hover:text-[#E8D2B5] whitespace-nowrap">Kết nối API</button>
          <button type="button" data-route="bots" onclick="navigate('bots')" class="nav-btn px-2.5 py-1.5 text-xs font-medium rounded border border-transparent text-[#A5A79B] hover:text-[#E8D2B5] whitespace-nowrap">Rủi ro</button>
          <button type="button" data-route="trades" onclick="navigate('trades')" class="nav-btn px-2.5 py-1.5 text-xs font-medium rounded border border-transparent text-[#A5A79B] hover:text-[#E8D2B5] whitespace-nowrap">Lịch sử</button>
          <button type="button" data-route="wallet" onclick="navigate('wallet')" class="nav-btn px-2.5 py-1.5 text-xs font-medium rounded border border-transparent text-[#A5A79B] hover:text-[#E8D2B5] whitespace-nowrap">Ví Credit</button>
          <button type="button" data-route="earn" onclick="navigate('earn')" class="nav-btn px-2.5 py-1.5 text-xs font-semibold rounded border border-transparent text-[#E8D2B5] hover:bg-[#590907]/40 whitespace-nowrap">Kiếm tiền</button>
          <button type="button" data-route="guide" onclick="navigate('guide')" class="nav-btn px-2.5 py-1.5 text-xs font-medium rounded border border-transparent text-[#A5A79B] hover:text-[#E8D2B5] whitespace-nowrap">Hướng dẫn</button>
          <button id="nav-admin-desktop" type="button" data-route="admin" onclick="navigate('admin')" class="nav-btn hidden px-2.5 py-1.5 text-xs font-semibold rounded border border-[#E8D2B5]/35 text-[#E8D2B5] whitespace-nowrap">Quản trị</button>
        </nav>
      </div>

      <div id="header-auth-area" class="flex items-center gap-2 shrink-0"></div>
    </div>
  </header>

  <!-- BẢNG THÔNG BÁO (DROPDOWN) -->
  <div id="notif-panel" class="hidden fixed top-16 right-4 w-[320px] max-w-[calc(100vw-2rem)] panel rounded-xl z-40 overflow-hidden shadow-2xl">
    <div class="px-4 py-3 border-b border-[#A5A79B]/20 flex items-center justify-between">
      <span class="text-xs font-bold uppercase tracking-wider text-[#E8D2B5]">Thông báo</span>
      <button type="button" onclick="markAllRead()" class="text-[11px] text-[#A5A79B] hover:text-[#E8D2B5]">Đánh dấu đã đọc</button>
    </div>
    <div id="notif-list" class="max-h-80 overflow-y-auto divide-y divide-[#A5A79B]/15"></div>
  </div>

  <!-- LIVE TICKER -->
  <div class="bg-[#181414] border-b border-[#A5A79B]/18">
    <div class="max-w-7xl mx-auto px-3 lg:px-6 py-2 grid grid-cols-3 gap-2 text-[11px] num">
      <div class="flex flex-col sm:flex-row sm:items-center sm:gap-2 min-w-0">
        <span class="text-[#A5A79B] font-semibold">BTC</span>
        <span id="top-price-BTCUSDT" class="text-[#E8D2B5] font-semibold truncate">Đang tải</span>
        <span id="top-pct-BTCUSDT" class="text-[10px] text-[#A5A79B]"></span>
      </div>
      <div class="flex flex-col sm:flex-row sm:items-center sm:gap-2 min-w-0 border-x border-[#A5A79B]/20 px-2">
        <span class="text-[#A5A79B] font-semibold">ETH</span>
        <span id="top-price-ETHUSDT" class="text-[#E8D2B5] font-semibold truncate">Đang tải</span>
        <span id="top-pct-ETHUSDT" class="text-[10px] text-[#A5A79B]"></span>
      </div>
      <div class="flex flex-col sm:flex-row sm:items-center sm:gap-2 min-w-0 pl-1">
        <span class="text-[#A5A79B] font-semibold">VÀNG</span>
        <span id="top-price-PAXGUSDT" class="text-[#E8D2B5] font-semibold truncate">Đang tải</span>
        <span id="top-pct-PAXGUSDT" class="text-[10px] text-[#A5A79B]"></span>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <main id="app-root" class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-6 py-6"></main>

  <!-- MOBILE BOTTOM NAV (6 MỤC CHÍNH GỒM KIẾM TIỀN & HƯỚNG DẪN) -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 w-full h-16 bg-[#161313]/96 backdrop-blur border-t border-[#A5A79B]/22 z-30 grid grid-cols-6 px-1">
    <button type="button" data-route="dashboard" onclick="navigate('dashboard')" class="m-nav min-w-0 flex flex-col items-center justify-center gap-1 text-[9.5px] leading-none text-[#A5A79B] px-0.5">
      <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
      <span>Tổng quan</span>
    </button>
    <button type="button" data-route="api-keys" onclick="navigate('api-keys')" class="m-nav min-w-0 flex flex-col items-center justify-center gap-1 text-[9.5px] leading-none text-[#A5A79B] px-0.5">
      <i data-lucide="key-round" class="w-4 h-4"></i>
      <span>API</span>
    </button>
    <button type="button" data-route="bots" onclick="navigate('bots')" class="m-nav min-w-0 flex flex-col items-center justify-center gap-1 text-[9.5px] leading-none text-[#A5A79B] px-0.5">
      <i data-lucide="sliders" class="w-4 h-4"></i>
      <span>Rủi ro</span>
    </button>
    <button type="button" data-route="wallet" onclick="navigate('wallet')" class="m-nav min-w-0 flex flex-col items-center justify-center gap-1 text-[9.5px] leading-none text-[#A5A79B] px-0.5">
      <i data-lucide="wallet" class="w-4 h-4"></i>
      <span>Ví</span>
    </button>
    <button type="button" data-route="earn" onclick="navigate('earn')" class="m-nav min-w-0 flex flex-col items-center justify-center gap-1 text-[9.5px] leading-none text-[#E8D2B5] px-0.5">
      <i data-lucide="users" class="w-4 h-4"></i>
      <span>Kiếm tiền</span>
    </button>
    <button type="button" data-route="guide" onclick="navigate('guide')" class="m-nav min-w-0 flex flex-col items-center justify-center gap-1 text-[9.5px] leading-none text-[#A5A79B] px-0.5">
      <i data-lucide="book-open" class="w-4 h-4"></i>
      <span>Hướng dẫn</span>
    </button>
  </nav>

  <script src="/guard.js"></script>
  <script type="module" src="/app.min.js"></script>
</body>
</html>
